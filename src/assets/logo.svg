<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Dark Near-Black Canvas with slight rounding for an app icon feel -->
  <rect width="120" height="120" rx="24" fill="#0a0a0a" />

  <!-- White Vertical Stem (Stability & Weight) -->
  <rect x="32" y="30" width="22" height="60" fill="#ffffff" />

  <!-- Lime Upward Trend Base (Momentum, Data & Precision) -->
  <!-- Adjusted polygon points for a flatter, horizontal base to form a distinct L shape, reducing the upward trend angle while maintaining momentum on the top edge -->
  <polygon points="54,90 87,90 87,75 54,68" fill="#a3e635" />
</svg>
